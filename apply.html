<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apply | LoanEase</title><link rel="stylesheet" href="style.css"></head><body><header class="header"><div class="container nav-container"><a class="logo" href="index.html"><span class="logo-icon">₹</span>LoanEase</a><a class="btn btn-primary" href="index.html">Home</a></div></header><section class="page-banner"><div class="container"><p class="section-label">LOAN APPLICATION</p><h1>Apply for a loan</h1><p>Complete the form below. This is a browser-only demo.</p></div></section><main class="section"><form id="applicationForm" class="portal-card portal-form"><div class="form-group"><label>Full name *</label><input name="name" required></div><div class="form-group"><label>Email *</label><input name="email" type="email" required></div><div class="form-group"><label>Mobile number *</label><input name="phone" required maxlength="10"></div><div class="form-group"><label>Age *</label><input name="age" type="number" min="18" required></div><div class="form-group"><label>Loan type *</label><select name="loan" required><option>Personal Loan</option><option>Education Loan</option><option>Home Loan</option><option>Vehicle Loan</option><option>Business Loan</option></select></div><div class="form-group"><label>Loan amount *</label><input name="amount" type="number" required></div><div class="form-group"><label>Monthly income *</label><input name="income" type="number" required></div><div class="form-group"><label>Employment type</label><select name="employment"><option>Salaried</option><option>Self employed</option><option>Business owner</option><option>Student</option></select></div><div class="form-group wide"><label>Loan purpose</label><textarea name="purpose" rows="4"></textarea></div><div class="wide"><label><input required type="checkbox"> I confirm that the information is correct.</label></div><button class="btn btn-primary wide">Submit loan application</button></form></main><script src="script.js"></script></body></html>
