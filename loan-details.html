<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Loan Details | LoanEase</title><link rel="stylesheet" href="style.css"></head>
<body data-loan-page><header class="header"><div class="container nav-container"><a class="logo" href="index.html"><span class="logo-icon">₹</span>LoanEase</a><a class="btn btn-primary" data-loan="apply" href="apply.html">Apply now</a></div></header>
<main><section class="loan-hero"><div class="container loan-hero-grid"><div><p class="section-label" data-loan="name">Personal Loan</p><h1 data-loan="headline">Personal loan for your personal needs.</h1><p data-loan="description">Funds for your financial requirements.</p></div><div class="loan-summary"><div><span>Interest rate</span><strong data-loan="rate"></strong></div><div><span>Tenure</span><strong data-loan="tenure"></strong></div><div><span>Processing</span><strong>Simple</strong></div></div></div></section>
<section class="section"><div class="container two-column"><div><h2>Benefits & eligibility</h2><ul class="check-list" data-loan="benefits"></ul></div><div class="calculator-box" data-emi><h3><span data-loan="name">Loan</span> EMI calculator</h3><label>Loan amount (₹)<input data-loan="amount" type="number" min="1000"></label><label>Interest rate (% p.a.)<input data-loan="rateInput" type="number" min="0" step="0.1"></label><label>Tenure (years)<input data-loan="years" type="number" min="1"></label><button class="btn btn-primary full-width">Calculate EMI</button><div class="calculator-output">Estimated monthly EMI <strong data-result></strong></div></div></div></section></main><script src="script.js"></script></body></html>
